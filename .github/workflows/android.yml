name: NurseMate Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NurseMate
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript
        run: npm install --save-dev typescript

      - name: Build AdMob bridge
        run: |
          npm install --no-save esbuild
          npx esbuild src/admob.ts \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=nursemate-admob.js

      - name: Prepare web files
        run: npm run prepare:web

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure AdMob App ID
        working-directory: android
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/admob.xml <<'EOF'
          <resources>
              <string name="admob_app_id">ca-app-pub-6797540694008479~1560001354</string>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          marker = "com.google.android.gms.ads.APPLICATION_ID"

          if marker not in text:
              text = text.replace(
                  "</application>",
                  """<meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />
              </application>"""
              )

          manifest.write_text(text)
          PY

      - name: Generate release signing key
        working-directory: android
        run: |
          keytool -genkeypair \
            -v \
            -keystore nursemate-release.jks \
            -storetype JKS \
            -alias nursemate \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass NurseMate2026 \
            -keypass NurseMate2026 \
            -dname "CN=NurseMate, OU=Mobile, O=NurseMate, L=Lagos, ST=Lagos, C=NG"

      - name: Configure release signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          text = gradle.read_text()

          signing = """
          
          android {
              signingConfigs {
                  release {
                      storeFile file("nursemate-release.jks")
                      storePassword "NurseMate2026"
                      keyAlias "nursemate"
                      keyPassword "NurseMate2026"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """

          if "nursemate-release.jks" not in text:
              text += signing

          gradle.write_text(text)
          PY

      - name: Build signed AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Find build files
        run: |
          find android/app/build/outputs \
            -type f \
            \( -name "*.aab" -o -name "*.apk" \) \
            -print

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: NurseMate-release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NurseMate-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
