name: NurseMate Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NurseMate
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript
        run: npm install --save-dev typescript

      - name: Build AdMob bridge
        run: |
          npm install --no-save esbuild
          npx esbuild src/admob.ts \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=nursemate-admob.js

      - name: Prepare web files
        run: npm run prepare:web

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure AdMob App ID
        working-directory: android
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/admob.xml <<'EOF'
          <resources>
              <string name="admob_app_id">ca-app-pub-6797540694008479~1560001354</string>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          marker = "com.google.android.gms.ads.APPLICATION_ID"

          if marker not in text:
              text = text.replace(
                  "</application>",
                  """<meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />
              </application>"""
              )

          manifest.write_text(text)
          PY

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          import sys

          data = os.environ.get("KEYSTORE_BASE64", "")

          if not data:
              print("ERROR: KEYSTORE_BASE64 secret is empty or missing.")
              sys.exit(1)

          # Remove spaces, line breaks and other whitespace
          data = "".join(data.split())

          # Restore Base64 padding if necessary
          data += "=" * (-len(data) % 4)

          try:
              decoded = base64.b64decode(data, validate=True)
          except Exception as e:
              print("ERROR: KEYSTORE_BASE64 is not valid Base64.")
              print(str(e))
              sys.exit(1)

          if len(decoded) == 0:
              print("ERROR: Decoded keystore is empty.")
              sys.exit(1)

          with open("nursemate-upload.keystore", "wb") as f:
              f.write(decoded)

          print("Keystore restored successfully.")
          print("Keystore size:", len(decoded), "bytes")
          PY

      - name: Verify signing keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore nursemate-upload.keystore \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Configure Android signing
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cp ../nursemate-upload.keystore app/nursemate-upload.keystore

          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          text = gradle.read_text()

          signing_block = """

          // NurseMate release signing
          android {
              signingConfigs {
                  release {
                      storeFile file("nursemate-upload.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          """

          if "nursemate-upload.keystore" not in text:
              text += signing_block

          gradle.write_text(text)
          PY

      - name: Build signed release AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug

      - name: Find Android files
        run: |
          echo "Android build files:"
          find android/app/build/outputs \
            -type f \
            \( -name "*.aab" -o -name "*.apk" \) \
            -print

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: NurseMate-release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK backup
        uses: actions/upload-artifact@v4
        with:
          name: NurseMate-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
