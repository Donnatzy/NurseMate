name: NurseMate Android Diagnostic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NurseMate
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript
        run: npm install --save-dev typescript

      - name: Temporarily remove AdMob
        run: npm uninstall @capacitor-community/admob --no-save

      - name: Prepare web files
        run: npm run prepare:web

      - name: Remove AdMob script from web app
        run: sed -i '/nursemate-admob.js/d' dist/index.html

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Find APK
        run: find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NurseMate-no-admob-test
          path: android/**/*.apk
          if-no-files-found: error
