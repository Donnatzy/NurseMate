name: NurseMate Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NurseMate
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript
        run: npm install --save-dev typescript

      - name: Build AdMob bridge
        run: |
          npm install --no-save esbuild
          npx esbuild src/admob.ts --bundle --format=iife --platform=browser --outfile=nursemate-admob.js

      - name: Prepare web files
        run: npm run prepare:web

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure AdMob App ID
        working-directory: android
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/admob.xml <<'EOF'
          <resources>
              <string name="admob_app_id">ca-app-pub-6797540694008479~1560001354</string>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          marker = 'com.google.android.gms.ads.APPLICATION_ID'

          if marker not in text:
              text = text.replace(
                  '</application>',
                  '''<meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />
              </application>'''
              )

          manifest.write_text(text)
          PY

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > nursemate-upload.keystore

      - name: Create signing properties
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=../nursemate-upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Configure release signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle")
          text = gradle.read_text()

          signing = '''
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          def keystoreProperties = new Properties()

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''

          if "keystorePropertiesFile" not in text:
              text = signing + "\n" + text

          if "signingConfigs" not in text:
              text = text.replace(
                  "android {",
                  '''android {
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                      }
                  }
              }
          ''',
                  1
              )

          text = text.replace(
              "buildTypes {",
              '''buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              ''',
              1
          )

          gradle.write_text(text)
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Find release files
        run: |
          find android -type f \\( -name "*.apk" -o -name "*.aab" \\) -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NurseMate-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: NurseMate-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
