name: NurseMate Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NurseMate
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install TypeScript
        run: npm install --save-dev typescript

      - name: Prepare web files
        run: npm run prepare:web

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure AdMob test App ID
        working-directory: android
        run: |
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/admob.xml <<'EOF'
          <resources>
              <string name="admob_app_id">ca-app-pub-3940256099942544~3347511713</string>
          </resources>
          EOF

          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          marker = 'com.google.android.gms.ads.APPLICATION_ID'

          if marker not in text:
              text = text.replace(
                  '</application>',
                  '''<meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />
              </application>'''
              )

          manifest.write_text(text)
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Find APK
        run: find android -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NurseMate-admob-test
          path: android/**/*.apk
          if-no-files-found: error
